<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loci — Memory Palace</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://static.kuula.io/api.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #080810;
      --panel:        #0f0f1a;
      --panel-border: #1e1e32;
      --gold:         #c9a84c;
      --gold-dim:     rgba(201,168,76,0.18);
      --gold-bright:  #e8c96a;
      --text:         #d8d4cc;
      --text-dim:     #6a6860;
      --danger:       rgba(200,60,60,0.65);
      --danger-hover: rgba(220,80,80,0.9);
      --marker-size:  14px;
      --sidebar-w:    340px;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel); flex-shrink: 0; z-index: 100;
    }
    .toolbar-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: 'Crimson Pro', serif; font-size: 18px; font-weight: 300; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; }
    .logo span { color: var(--text-dim); font-style: italic; font-size: 12px; letter-spacing: 0.04em; text-transform: none; }
    .divider { width: 1px; height: 20px; background: var(--panel-border); }
    .room-name { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar-right { display: flex; align-items: center; gap: 10px; }
    .marker-pill { font-size: 10px; background: var(--gold-dim); color: var(--gold); border-radius: 20px; padding: 2px 10px; letter-spacing: 0.06em; border: 1px solid rgba(201,168,76,0.25); }
    .btn { display: flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--panel-border); background: transparent; color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; cursor: pointer; white-space: nowrap; transition: border-color 0.15s, color 0.15s, background 0.15s; }
    .btn:hover { border-color: var(--gold); color: var(--gold); }
    .btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-bright); }
    .btn-icon { width: 13px; height: 13px; flex-shrink: 0; }

    .main { display: flex; flex: 1; overflow: hidden; }
    .panorama-wrap { position: relative; flex: 1; overflow: hidden; }
    .kuula-container { position: absolute; inset: 0; }
    .kuula-container iframe { width: 100%; height: 100%; border: none; display: block; }

    .click-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; cursor: default; }
    .click-overlay.pin-mode { pointer-events: all; cursor: crosshair; }
    .pin-banner { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(201,168,76,0.12); border: 1px solid var(--gold); color: var(--gold-bright); padding: 8px 20px; border-radius: 4px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
    .pin-mode-active .pin-banner { opacity: 1; }

    #markersContainer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
    .marker { position: absolute; width: var(--marker-size); height: var(--marker-size); transform: translate(-50%, -50%); cursor: pointer; pointer-events: all; transition: opacity 0.2s; }
    .marker.hidden { opacity: 0; pointer-events: none; }
    .marker-dot { width: 100%; height: 100%; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,76,0.35), 0 0 14px rgba(201,168,76,0.25); transition: transform 0.15s, box-shadow 0.15s; }
    .marker:hover .marker-dot { transform: scale(1.35); box-shadow: 0 0 0 3px rgba(201,168,76,0.5), 0 0 20px rgba(201,168,76,0.4); }
    .marker.selected .marker-dot { background: var(--gold-bright); box-shadow: 0 0 0 3px rgba(232,201,106,0.5), 0 0 20px rgba(232,201,106,0.5); }
    .marker-ring { position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--gold); opacity: 0; animation: pulse-ring 2.8s ease-out infinite; }
    .marker-ring:nth-child(2) { animation-delay: 1.1s; }
    @keyframes pulse-ring { 0% { transform: scale(0.7); opacity: 0.55; } 100% { transform: scale(2.4); opacity: 0; } }

    .sidebar { width: 0; overflow: hidden; transition: width 0.28s cubic-bezier(0.4,0,0.2,1); border-left: 1px solid transparent; background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar.open { width: var(--sidebar-w); border-left-color: var(--panel-border); }
    .sidebar-inner { width: var(--sidebar-w); padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; height: 100%; overflow-y: auto; }
    .sidebar-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .sidebar-title { font-family: 'Crimson Pro', serif; font-size: 22px; font-weight: 300; color: var(--text); line-height: 1.2; }
    .sidebar-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 2px; line-height: 1; flex-shrink: 0; transition: color 0.15s; }
    .sidebar-close:hover { color: var(--text); }
    .sidebar-meta { font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .sidebar-meta::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
    .note-divider { height: 1px; background: var(--panel-border); }
    .note-display { font-family: 'Crimson Pro', serif; font-size: 16px; line-height: 1.75; color: var(--text); flex: 1; }
    .sidebar-actions { display: flex; gap: 8px; }
    .btn-wide { flex: 1; justify-content: center; }
    .btn-danger { border-color: rgba(200,60,60,0.3); color: var(--danger); justify-content: center; }
    .btn-danger:hover { border-color: var(--danger-hover); color: var(--danger-hover); }

    .add-note-form { display: flex; flex-direction: column; gap: 14px; }
    .form-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; display: block; }
    .form-input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); border-radius: 4px; color: var(--text); font-family: 'Crimson Pro', serif; font-size: 15px; padding: 8px 12px; outline: none; transition: border-color 0.15s; resize: none; }
    .form-input:focus { border-color: var(--gold); }
    .form-input::placeholder { color: var(--text-dim); }
    .form-textarea { min-height: 120px; line-height: 1.6; }
    .btn-save { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-bright); justify-content: center; padding: 9px 14px; font-size: 12px; }
    .btn-save:hover { background: rgba(201,168,76,0.28); }

    .markers-list { display: flex; flex-direction: column; gap: 7px; flex: 1; overflow-y: auto; }
    .marker-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--panel-border); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .marker-item:hover { border-color: var(--gold); background: var(--gold-dim); }
    .marker-item-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
    .marker-item-text { flex: 1; overflow: hidden; }
    .marker-item-title { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .marker-item-preview { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-dim); }
    .empty-state-glyph { font-size: 28px; margin-bottom: 14px; opacity: 0.35; }
    .empty-state-text { font-family: 'Crimson Pro', serif; font-size: 15px; line-height: 1.7; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
  </style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <div class="logo">Loci <span>memory palace</span></div>
    <div class="divider"></div>
    <div class="room-name" id="roomName">Connecting to room…</div>
  </div>
  <div class="toolbar-right">
    <div class="marker-pill" id="markerPill">0 markers</div>
    <button class="btn" id="listBtn" onclick="toggleList()">
      <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>All Notes
    </button>
    <button class="btn" id="pinBtn" onclick="togglePinMode()">
      <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="6" r="2.5"/><path d="M8 15 C8 15 3 10 3 6.5 A5 5 0 0 1 13 6.5 C13 10 8 15 8 15Z"/>
      </svg>Pin Note
    </button>
  </div>
</div>

<div class="main">
  <div class="panorama-wrap" id="panoramaWrap">
    <div class="kuula-container">
      <iframe
        id="kuulaFrame"
        src="https://kuula.co/share/collection/7fQzw?logo=1&info=1&fs=1&vr=0&sd=1&thumbs=1"
        frameborder="0"
        allow="xr-spatial-tracking; gyroscope; accelerometer"
        allowfullscreen scrolling="no">
      </iframe>
    </div>
    <div class="click-overlay" id="clickOverlay" onclick="handleOverlayClick(event)">
      <div class="pin-banner">Click anywhere to place a marker</div>
    </div>
    <div id="markersContainer"></div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner" id="sidebarInner"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let allMarkers    = JSON.parse(localStorage.getItem('loci-markers') || '[]');
let orientation   = { heading: 0, pitch: 0, zoom: 0 };
let frameId       = null;
let currentPostId = null;
let pinMode       = false;
let sidebarMode   = null;
let activeId      = null;
let pendingAnchor = null;

function roomMarkers() {
  return allMarkers.filter(m => m.postId === currentPostId);
}

/* ═══════════════════════════════════════
   KUULA API
═══════════════════════════════════════ */
KuulaPlayerAPI.addEventListener("frameloaded", (e) => {
  frameId = e.frame;
  const posts = e.data?.posts;
  if (posts?.length > 0 && !currentPostId) {
    currentPostId = String(posts[0].id);
    setRoomName(posts[0].title || 'Room');
  }
  renderAll();
});

KuulaPlayerAPI.addEventListener("postloaded", (e) => {
  // Try every possible field Kuula might use for post ID
  const newId = String(
    e.data?.id ?? e.data?.uid ?? e.data?.post ?? e.data?.postId ?? ''
  );
  if (newId && newId !== 'undefined' && newId !== currentPostId) {
    currentPostId = newId;
    closeSidebar();
    renderAll();
  }
  if (e.data?.title) setRoomName(e.data.title);
});

KuulaPlayerAPI.addEventListener("orientation", (e) => {
  orientation = { heading: e.data.heading, pitch: e.data.pitch, zoom: e.data.zoom };
  reposition();
});

function setRoomName(n) {
  document.getElementById('roomName').textContent = n;
}

/* ═══════════════════════════════════════
   PROJECTION — full 3D spherical → screen

   Kuula axes:
     heading  0-360°  increases going RIGHT
     pitch   -90–+90  negative=down, positive=up
     zoom    -1–+1    -1=zoomed in (narrow), +1=zoomed out (wide)

   Previous approach used independent tan(dH)/tan(dP) which
   drifts when both heading and pitch deltas are non-zero.
   This version converts to 3-D, rotates into camera space,
   then does a single perspective divide — markers stay locked.
═══════════════════════════════════════ */
const DEG = Math.PI / 180;

function getHFovRad() {
  const deg = Math.max(40, Math.min(130, 75 + orientation.zoom * 28));
  return deg * DEG;
}

function projectToScreen(aH, aP) {
  const wrap = document.getElementById('panoramaWrap');
  const W = wrap.offsetWidth, H = wrap.offsetHeight;

  const fovH_r = getHFovRad();
  const f = (W / 2) / Math.tan(fovH_r / 2);

  // Anchor → 3-D unit vector  (Y = up, Z = forward at heading 0)
  const aH_r = aH * DEG;
  const aP_r = aP * DEG;
  const px = Math.cos(aP_r) * Math.sin(aH_r);
  const py = Math.sin(aP_r);
  const pz = Math.cos(aP_r) * Math.cos(aH_r);

  // Camera orientation
  const cH = orientation.heading * DEG;
  const cP = orientation.pitch   * DEG;

  // Rotate by -heading around Y
  const cosH = Math.cos(cH), sinH = Math.sin(cH);
  const rx =  px * cosH - pz * sinH;
  const ry =  py;
  const rz =  px * sinH + pz * cosH;

  // Rotate by -pitch around X
  const cosP = Math.cos(cP), sinP = Math.sin(cP);
  const ex = rx;
  const ey = ry * cosP + rz * sinP;
  const ez = -ry * sinP + rz * cosP;

  // Behind camera
  if (ez <= 0.001) return { x: -9999, y: -9999, visible: false };

  // Perspective divide
  const sx = W / 2 + f * (ex / ez);
  const sy = H / 2 - f * (ey / ez);   // screen-Y is inverted

  const margin = 60;
  const visible = sx > -margin && sx < W + margin && sy > -margin && sy < H + margin;

  return { x: sx, y: sy, visible };
}

/* ═══════════════════════════════════════
   MARKER DOM
═══════════════════════════════════════ */
function renderAll() {
  const c = document.getElementById('markersContainer');
  c.innerHTML = '';
  roomMarkers().forEach(m => c.appendChild(buildMarkerEl(m)));
  updatePill();
  reposition();
}

function buildMarkerEl(m) {
  const el = document.createElement('div');
  el.className = 'marker';
  el.id = `marker-${m.id}`;
  el.innerHTML = `<div class="marker-ring"></div><div class="marker-ring"></div><div class="marker-dot"></div>`;
  el.addEventListener('click', ev => { ev.stopPropagation(); openView(m.id); });
  return el;
}

function reposition() {
  roomMarkers().forEach(m => {
    const el = document.getElementById(`marker-${m.id}`);
    if (!el) return;
    const { x, y, visible } = projectToScreen(m.anchor.heading, m.anchor.pitch);
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.classList.toggle('hidden', !visible);
    el.classList.toggle('selected', m.id === activeId);
  });
}

function updatePill() {
  const n = roomMarkers().length;
  document.getElementById('markerPill').textContent = `${n} marker${n !== 1 ? 's' : ''}`;
}

/* ═══════════════════════════════════════
   PIN MODE
═══════════════════════════════════════ */
function togglePinMode() {
  pinMode = !pinMode;
  document.getElementById('clickOverlay').classList.toggle('pin-mode', pinMode);
  document.getElementById('panoramaWrap').classList.toggle('pin-mode-active', pinMode);
  document.getElementById('pinBtn').classList.toggle('active', pinMode);
  if (pinMode) closeSidebar();
}

function handleOverlayClick(e) {
  if (!pinMode) return;

  const wrap = document.getElementById('panoramaWrap');
  const rect = wrap.getBoundingClientRect();

  // Pixel offset from screen centre
  const cx = e.clientX - rect.left  - rect.width  / 2;
  const cy = -(e.clientY - rect.top - rect.height / 2); // flip Y to match 3-D

  // Focal length
  const fovH_r = getHFovRad();
  const f      = (rect.width / 2) / Math.tan(fovH_r / 2);

  // Ray in camera / eye space  (forward = +Z, up = +Y, right = +X)
  const len = Math.sqrt(cx * cx + cy * cy + f * f);
  const ex = cx / len;
  const ey = cy / len;
  const ez = f  / len;

  // Inverse rotate: pitch then heading to get world-space direction
  const cH = orientation.heading * DEG;
  const cP = orientation.pitch   * DEG;

  // Undo pitch (rotate by +pitch around X)
  const cosP = Math.cos(cP), sinP = Math.sin(cP);
  const rx = ex;
  const ry = ey * cosP - ez * sinP;
  const rz = ey * sinP + ez * cosP;

  // Undo heading (rotate by +heading around Y)
  const cosH = Math.cos(cH), sinH = Math.sin(cH);
  const wx =  rx * cosH + rz * sinH;
  const wy =  ry;
  const wz = -rx * sinH + rz * cosH;

  // World-space direction → spherical heading / pitch
  const aP = Math.asin(Math.max(-1, Math.min(1, wy))) / DEG;
  let   aH = Math.atan2(wx, wz) / DEG;
  aH = ((aH % 360) + 360) % 360;

  pendingAnchor = { heading: aH, pitch: aP };
  togglePinMode();
  openAddForm();
}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
function openSidebar(html) {
  document.getElementById('sidebarInner').innerHTML = html;
  document.getElementById('sidebar').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  activeId = null; sidebarMode = null;
  reposition();
}

function openView(id) {
  const m = allMarkers.find(x => x.id === id);
  if (!m) return;
  activeId = id; sidebarMode = 'view'; reposition();
  openSidebar(`
    <div class="sidebar-header">
      <div class="sidebar-title">${esc(m.title)}</div>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar-meta">${fmtDate(m.createdAt)}</div>
    <div class="note-divider"></div>
    <div class="note-display">${esc(m.note).replace(/\n/g,'<br>')}</div>
    <div class="note-divider"></div>
    <div class="sidebar-actions">
      <button class="btn btn-wide" onclick="openEditForm('${id}')">Edit</button>
      <button class="btn btn-danger" onclick="deleteMarker('${id}')">Delete</button>
    </div>`);
}

function openAddForm() {
  sidebarMode = 'add';
  openSidebar(`
    <div class="sidebar-header">
      <div class="sidebar-title">New Marker</div>
      <button class="sidebar-close" onclick="closeSidebar();pendingAnchor=null;">✕</button>
    </div>
    <div class="sidebar-meta">Anchored to clicked position</div>
    <div class="note-divider"></div>
    <div class="add-note-form">
      <div><label class="form-label">Title</label>
        <input class="form-input" id="fTitle" placeholder="e.g. The Sofa" autocomplete="off"></div>
      <div><label class="form-label">Note</label>
        <textarea class="form-input form-textarea" id="fNote" placeholder="Write your memory here…"></textarea></div>
      <button class="btn btn-save" onclick="saveNew()">Save Marker</button>
    </div>`);
  setTimeout(() => document.getElementById('fTitle')?.focus(), 80);
}

function openEditForm(id) {
  const m = allMarkers.find(x => x.id === id);
  if (!m) return;
  sidebarMode = 'edit';
  openSidebar(`
    <div class="sidebar-header">
      <div class="sidebar-title">Edit Marker</div>
      <button class="sidebar-close" onclick="openView('${id}')">✕</button>
    </div>
    <div class="note-divider"></div>
    <div class="add-note-form">
      <div><label class="form-label">Title</label>
        <input class="form-input" id="fTitle" value="${esc(m.title)}"></div>
      <div><label class="form-label">Note</label>
        <textarea class="form-input form-textarea" id="fNote">${esc(m.note)}</textarea></div>
      <button class="btn btn-save" onclick="saveEdit('${id}')">Save Changes</button>
    </div>`);
}

function toggleList() {
  if (sidebarMode === 'list') { closeSidebar(); return; }
  sidebarMode = 'list'; activeId = null; reposition();
  const rm = roomMarkers();
  const items = rm.length === 0
    ? `<div class="empty-state"><div class="empty-state-glyph">◎</div>
       <div class="empty-state-text">No markers in this room yet.<br>Click <em>Pin Note</em> to place your first memory.</div></div>`
    : rm.map(m => `
        <div class="marker-item" onclick="openView('${m.id}')">
          <div class="marker-item-dot"></div>
          <div class="marker-item-text">
            <div class="marker-item-title">${esc(m.title)}</div>
            <div class="marker-item-preview">${esc(m.note.slice(0,64))}${m.note.length>64?'…':''}</div>
          </div>
        </div>`).join('');
  openSidebar(`
    <div class="sidebar-header">
      <div class="sidebar-title">This Room</div>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar-meta">${rm.length} marker${rm.length!==1?'s':''}</div>
    <div class="note-divider"></div>
    <div class="markers-list">${items}</div>`);
}

/* ═══════════════════════════════════════
   DATA OPS
═══════════════════════════════════════ */
function saveNew() {
  const title = document.getElementById('fTitle')?.value.trim();
  const note  = document.getElementById('fNote')?.value.trim();
  if (!title || !note || !pendingAnchor) return;
  const m = {
    id: Date.now().toString(),
    postId: currentPostId,      // ← scoped to this room
    title, note,
    anchor: pendingAnchor,
    createdAt: new Date().toISOString()
  };
  allMarkers.push(m);
  persist(); pendingAnchor = null;
  document.getElementById('markersContainer').appendChild(buildMarkerEl(m));
  updatePill(); reposition(); openView(m.id);
}

function saveEdit(id) {
  const title = document.getElementById('fTitle')?.value.trim();
  const note  = document.getElementById('fNote')?.value.trim();
  if (!title || !note) return;
  const m = allMarkers.find(x => x.id === id);
  if (!m) return;
  m.title = title; m.note = note;
  persist(); openView(id);
}

function deleteMarker(id) {
  allMarkers = allMarkers.filter(x => x.id !== id);
  persist();
  document.getElementById(`marker-${id}`)?.remove();
  updatePill(); closeSidebar();
}

function persist() {
  localStorage.setItem('loci-markers', JSON.stringify(allMarkers));
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });
